<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Products</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/navbar.css">
    <style>
        .card-img-top { height: 200px; object-fit: cover; }
        .price-old { text-decoration: line-through; color: gray; margin-right: 5px; }
        .price-new { font-weight: bold; color: #dc3545; }
        aside { position: sticky; top: 20px; }
    </style>
</head>
<body>
<div id="navbar-container"></div>
<div class="container mb-5" style="margin-top: 100px;">
    <div class="row">
        <!-- Sidebar Filters -->
        <aside class="col-md-3 mb-4">
            <h5>Filters</h5>
            <div class="mb-3">
                <label for="searchInput" class="form-label">Search Product</label>
                <input type="text" id="searchInput" class="form-control" placeholder="Search by name">
            </div>

            <div class="mb-3">
                <h6>Category</h6>
                <div id="categoryFilters"></div>
            </div>

            <div class="mb-3">
                <h6>Rating</h6>
                <select id="ratingFilter" class="form-select">
                    <option value="">All Ratings</option>
                    <option value="high">Highest Rated</option>
                    <option value="low">Lowest Rated</option>
                    <option value="avg">Average</option>
                </select>
            </div>

            <div class="mb-3">
                <h6>Price</h6>
                <input type="number" id="minPrice" class="form-control mb-2" placeholder="Min Price">
                <input type="number" id="maxPrice" class="form-control" placeholder="Max Price">
            </div>
        </aside>

        <!-- Products -->
        <div class="col-md-9">
            <div class="row" id="products-container"></div>
        </div>
    </div>
</div>
<div id="footer-container"></div>

<script>
var FIREBASE_URL = FIREBASE_URL || "https://e-commerce-2d795-default-rtdb.firebaseio.com";

const productsContainer = document.getElementById("products-container");
const searchInput = document.getElementById("searchInput");
const categoryFilters = document.getElementById("categoryFilters");
const ratingFilter = document.getElementById("ratingFilter");
const minPriceInput = document.getElementById("minPrice");
const maxPriceInput = document.getElementById("maxPrice");

let allProducts = [];

async function updateCartCount() {
    const user = JSON.parse(localStorage.getItem("user"));
    if (!user) return;

    try {
        const res = await fetch(`${FIREBASE_URL}/carts.json`);
        const data = await res.json();

        let total = 0;
        if (data) {
            // بنلف على كل الكروت وبنجمع كمية المنتجات الخاصة باليوزر ده بس
            Object.values(data).forEach(item => {
                if (item.userId === user.id) {
                    total += (item.quantity || 0);
                }
            });
        }
        document.querySelectorAll(".cart-count").forEach(el => el.textContent = total);
    } catch (err) {
        console.error("Cart Count Error:", err);
    }
}

async function addToCart(product) {
    const user = JSON.parse(localStorage.getItem("user"));
    if (!user) { alert("Please login first!"); return; }

    try {
        const res = await fetch(`${FIREBASE_URL}/carts.json`);
        const data = await res.json();

        let existingKey = null;
        let currentQty = 0;

        if (data) {
            for (let key in data) {
                if (data[key].userId === user.id && data[key].productId === product.id) {
                    existingKey = key;
                    currentQty = data[key].quantity;
                    break;
                }
            }
        }

        if (existingKey) {
            await fetch(`${FIREBASE_URL}/carts/${existingKey}.json`, {
                method: "PATCH",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ quantity: currentQty + 1 })
            });
        } else {
            await fetch(`${FIREBASE_URL}/carts.json`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    userId: user.id,
                    productId: product.id,
                    title: product.title,
                    price: product.price,
                    discountPercentage: product.discountPercentage || 0,
                    image: product.thumbnail,
                    quantity: 1
                })
            });
        }

        updateCartCount();
        alert(`${product.title} added to cart!`);
    } catch (err) {
        alert("Error adding to cart");
    }
}

fetch(`${FIREBASE_URL}/products.json`)
    .then(res => res.json())
    .then(data => {
        allProducts = data ? Object.values(data) : [];

        const categories = [...new Set(allProducts.map(p => p.category))];
        categoryFilters.innerHTML = categories.map(cat => `
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="${cat}" id="cat-${cat.replace(/\s+/g, '-')}">
                <label class="form-check-label" for="cat-${cat.replace(/\s+/g, '-')}">${cat}</label>
            </div>
        `).join("");

        searchInput.addEventListener("input", applyFilters);
        categoryFilters.addEventListener("change", applyFilters);
        ratingFilter.addEventListener("change", applyFilters);
        minPriceInput.addEventListener("input", applyFilters);
        maxPriceInput.addEventListener("input", applyFilters);

        applyFilters();
    });

function displayProducts(products) {
    productsContainer.innerHTML = "";

    if (products.length === 0) {
        productsContainer.innerHTML = "<p class='text-center w-100'>No products found</p>";
        return;
    }

    products.forEach(product => {
        const imgSrc = product.thumbnail || 'https://via.placeholder.com/200';
        let priceHTML = `$${product.price.toFixed(2)}`;
        
        if (product.discountPercentage) {
            const discountedPrice = (product.price * (1 - product.discountPercentage / 100)).toFixed(2);
            priceHTML = `<span class="price-old">$${product.price.toFixed(2)}</span>
                         <span class="price-new">$${discountedPrice}</span>`;
        }

        const col = document.createElement("div");
        col.className = "col-6 col-md-4 col-lg-3 mb-4";
        col.innerHTML = `
            <div class="card h-100 shadow-sm border-0">
                <a href="productDetails.html?id=${product.id}">
                    <img src="${imgSrc}" class="card-img-top" style="border-radius: 8px 8px 0 0;">
                </a>
                <div class="card-body d-flex flex-column">
                    <h6 class="text-truncate" title="${product.title}">${product.title}</h6>
                    <p class="mb-2">${priceHTML}</p>
                    <button class="btn btn-dark mt-auto add-cart-btn btn-sm">Add To Cart</button>
                </div>
            </div>
        `;
        col.querySelector(".add-cart-btn").addEventListener("click", () => addToCart(product));
        productsContainer.appendChild(col);
    });
}

function applyFilters() {
    let filtered = [...allProducts];

    const searchText = searchInput.value.toLowerCase();
    if (searchText) filtered = filtered.filter(p => p.title.toLowerCase().includes(searchText));

    const selectedCats = Array.from(categoryFilters.querySelectorAll("input:checked")).map(input => input.value);
    if (selectedCats.length > 0) filtered = filtered.filter(p => selectedCats.includes(p.category));

    const ratingVal = ratingFilter.value;
    if (ratingVal === "high") filtered.sort((a, b) => (b.rating || 0) - (a.rating || 0));
    else if (ratingVal === "low") filtered.sort((a, b) => (a.rating || 0) - (b.rating || 0));
    else if (ratingVal === "avg") filtered = filtered.filter(p => p.rating >= 3 && p.rating <= 4);

    const minP = parseFloat(minPriceInput.value);
    const maxP = parseFloat(maxPriceInput.value);
    if (!isNaN(minP)) filtered = filtered.filter(p => p.price >= minP);
    if (!isNaN(maxP)) filtered = filtered.filter(p => p.price <= maxP);

    displayProducts(filtered);
}

document.addEventListener("DOMContentLoaded", updateCartCount);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/navbar.js"></script>
<script src="../js/footr.js"></script>
</body>
</html>
